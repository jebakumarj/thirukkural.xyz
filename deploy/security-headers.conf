# Security headers, included in every location block.
#
# nginx does not merge `add_header` across levels: a location that declares any
# `add_header` of its own drops every one inherited from `server`. Since most
# locations here set their own Cache-Control, these headers have to be included
# in each of them rather than declared once at the top.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The app loads nothing from anywhere else — no CDN, no API, no remote fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
