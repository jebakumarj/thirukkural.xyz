# thirukkural.xyz — static site, no application server.
#
# Install as /etc/nginx/sites-available/thirukkural.xyz and symlink into
# sites-enabled, with security-headers.conf in /etc/nginx/snippets/ as
# thirukkural-security-headers.conf. See server-setup.md.
# TLS lines below are the ones certbot writes; run
#   sudo certbot --nginx -d thirukkural.xyz -d www.thirukkural.xyz
# once and it will fill them in.

server {
    listen 80;
    listen [::]:80;
    server_name thirukkural.xyz www.thirukkural.xyz;

    # Certbot's renewal check must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://thirukkural.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thirukkural.xyz;

    ssl_certificate /etc/letsencrypt/live/thirukkural.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thirukkural.xyz/privkey.pem;

    return 301 https://thirukkural.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thirukkural.xyz;

    # `current` is a symlink to the active release; a deploy swaps it
    # atomically, so the site is never half-updated.
    root /var/www/thirukkural/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/thirukkural.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thirukkural.xyz/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json image/svg+xml;
    # Uncomment if ngx_brotli is installed; it beats gzip on this content.
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json
    #              application/manifest+json image/svg+xml;

    # --- caching -------------------------------------------------------
    # Every location repeats the security headers, because nginx drops
    # inherited `add_header` directives wherever a location sets its own.

    # Hashed filenames can be cached forever.
    location ~* \.(?:js|css|woff2)$ {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Stable names, so a month rather than a year.
    location /icons/ {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # These three decide when clients see a new build. If they are cached,
    # visitors stay on an old service worker indefinitely.
    location = /ngsw.json {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /ngsw-worker.js {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
    }

    location = /sitemap.xml {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # --- pages ---------------------------------------------------------
    # Every route is prerendered to <route>/index.html. Anything else is a
    # genuine 404: the error page below serves the empty client-rendered
    # shell, so the app draws its own not-found page while the status stays
    # 404 for crawlers.
    location / {
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 =404 /index.csr.html;

    location = /index.csr.html {
        internal;
        include snippets/thirukkural-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    access_log /var/log/nginx/thirukkural.access.log;
    error_log /var/log/nginx/thirukkural.error.log;
}
