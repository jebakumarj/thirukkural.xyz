# thirukkural.xyz — static site, no application server.
#
# Install as /etc/nginx/sites-available/thirukkural.xyz and symlink into
# sites-enabled. TLS lines below are the ones certbot writes; run
#   sudo certbot --nginx -d thirukkural.xyz -d www.thirukkural.xyz
# once and it will fill them in.

server {
    listen 80;
    listen [::]:80;
    server_name thirukkural.xyz www.thirukkural.xyz;

    # Certbot's renewal check must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://thirukkural.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thirukkural.xyz;

    ssl_certificate /etc/letsencrypt/live/thirukkural.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thirukkural.xyz/privkey.pem;

    return 301 https://thirukkural.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thirukkural.xyz;

    # `current` is a symlink to the active release; deploy.sh swaps it
    # atomically, so a deploy is never half-visible.
    root /var/www/thirukkural/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/thirukkural.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thirukkural.xyz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app loads nothing from anywhere else — no CDN, no API, no fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json image/svg+xml;
    # Uncomment if ngx_brotli is installed; it beats gzip on this content.
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json
    #              application/manifest+json image/svg+xml;

    # --- caching -------------------------------------------------------
    # Hashed filenames can be cached forever.
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # These three decide when clients see a new build. If they are cached,
    # visitors stay on an old service worker indefinitely.
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }

    # --- pages ---------------------------------------------------------
    # Every route is prerendered to <route>/index.html. Anything else falls
    # back to index.csr.html, the empty client-rendered shell, so an unknown
    # URL shows the app’s own not-found page rather than a flash of the home
    # page’s prerendered content.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ /index.csr.html;
    }

    error_page 404 /index.csr.html;

    access_log /var/log/nginx/thirukkural.access.log;
    error_log /var/log/nginx/thirukkural.error.log;
}
